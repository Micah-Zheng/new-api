services:
  check-cx:
    image: bingzi233/check-cx:latest
    container_name: check-cx
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.check-cx
    environment:
      - NODE_ENV=production

  check-cx-admin:
    image: bingzi233/check-cx-admin:v0.1.1
    container_name: check-cx-admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.check-cx-admin
    environment:
      - NODE_ENV=production
      - APP_URL=${ADMIN_APP_URL}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-check-cx
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - check-cx
      - check-cx-admin
